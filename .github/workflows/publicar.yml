# Publica a pasta site/ no GitHub Pages.
# Para funcionar uma vez: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
  workflow_run:                 # roda depois do robô (commits do robô não disparam "push")
    workflows: ["Atualizar dados"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt
      - name: Montar as leituras da semana (leituras/*.md)
        run: python coletar.py --so-leituras
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
