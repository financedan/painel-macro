# Robô que atualiza os dados do painel sozinho.
# Fica em: .github/workflows/atualizar.yml
name: Atualizar dados

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 13h UTC = 10h de Brasília, de segunda a sexta
  workflow_dispatch:           # cria o botão "Run workflow" para rodar na mão

permissions:
  contents: write              # deixa o robô salvar o dados.json no repositório

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt

      - name: Coletar os dados
        run: python coletar.py

      - name: Salvar o dados.json no GitHub
        if: always()            # salva o que deu certo mesmo se uma fonte falhar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dados.json
          git diff --staged --quiet || git commit -m "Atualiza dados $(date +'%d/%m/%Y')"
          git push
