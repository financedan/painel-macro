# Robô que atualiza os dados do painel sozinho.
name: Atualizar dados

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 22h UTC = 19h de Brasília, de segunda a sexta (depois do fechamento da bolsa)
  workflow_dispatch:           # cria o botão "Run workflow" para rodar na mão

permissions:
  contents: write              # deixa o robô salvar os dados no repositório

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt

      - name: Coletar os dados
        id: coleta
        continue-on-error: true   # salva o que deu certo mesmo se uma fonte falhar
        run: python coletar.py

      - name: Salvar no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          if git diff --staged --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Atualiza dados $(TZ=America/Sao_Paulo date +'%d/%m/%Y')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # Opcional: crie os segredos TELEGRAM_TOKEN e TELEGRAM_CHAT (Settings > Secrets > Actions)
      # para receber no Telegram as falhas da coleta e as novidades (Copom, novo Focus, novo IPCA).
      - name: Avisar no Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT" ]; then echo "Telegram não configurado."; exit 0; fi
          msg=""
          if [ "${{ steps.coleta.outcome }}" != "success" ]; then
            msg="Painel Macro: a coleta de hoje teve erros. $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          if [ -s avisos.txt ]; then msg="$msg"$'\n'"$(cat avisos.txt)"; fi
          if [ -n "$msg" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT}" --data-urlencode "text=${msg}" > /dev/null
          fi

      - name: Marcar a execução como falha se a coleta falhou
        if: steps.coleta.outcome == 'failure'
        run: |
          echo "::error::Uma ou mais fontes falharam. O painel mostra o último dado bom e avisa o visitante."
          exit 1
