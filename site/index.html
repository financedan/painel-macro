<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Macro Brasil</title>
<meta name="description" content="Juros, inflação e expectativas do mercado no Brasil, com dados do Banco Central atualizados automaticamente.">
<meta property="og:title" content="Painel Macro Brasil">
<meta property="og:description" content="Selic, IPCA, juro real, Boletim Focus e Ibovespa em um só painel, atualizado sozinho todo dia útil.">
<meta property="og:image" content="img/fundo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="css/painel.css" rel="stylesheet">
</head>
<body>
<div id="app"></div>

<!-- Modelo do painel: os {{campos}} são preenchidos pelo js/painel.js -->
<template id="modelo">
<div class="{{rootClass}}" style="position: relative; min-height: 100vh; color: #ededed; font-family: 'DM Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.5; overflow-x: hidden; isolation: isolate">
<div class="pm-bg" aria-hidden="true">
<div class="pm-scene pm-scene-dusk pm-scene-on"></div>
</div>
<div class="pm-veil" aria-hidden="true"></div>

<template data-if="askName">
<div class="pm-welcome" style="position: relative; z-index: 5; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; padding: 20px 24px 32px">
<div class="pm-fade" style="display: flex; align-items: center; gap: 10px">
<div class="pm-glass" style="width: 40px; height: 40px; border-radius: 9999px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ededed" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M3 17h18M6 17a6 6 0 0 1 12 0M12 5v2M5.6 7.6l1.4 1.4M18.4 7.6 17 9"></path></svg></div>
<div style="display: flex; flex-direction: column; line-height: 1.25">
<span style="font-size: 15px; font-weight: 500; letter-spacing: -0.01em">Painel Macro Brasil</span>
<span style="font-size: 12px; color: #c2c2c2; display: flex; align-items: center; gap: 6px"><span class="pm-pulse" style="width: 6px; height: 6px; border-radius: 9999px; background: #ededed"></span>Dados do Banco Central</span>
</div>
</div>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 0">
<form class="pm-glass pm-rise pm-welcome-card" aria-labelledby="t-welcome" onSubmit="{{saveName}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 500; letter-spacing: .12em; color: #f0b37a">ANTES DE COMEÇAR</span>
<h1 id="t-welcome" style="margin: 0; font-size: 38px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.1">Como podemos te chamar?</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #c2c2c2">Seu nome aparece na saudação do painel: Bom dia, Boa tarde ou Boa noite, conforme o horário.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pm-nome" style="font-size: 13px; color: #c2c2c2; letter-spacing: .02em">Seu nome</label>
<div class="pm-glass-dark pm-field">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c2c2c2" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0"></path></svg>
<input id="pm-nome" class="pm-input" type="text" maxlength="30" autocomplete="given-name" placeholder="Ex.: Daniel" value="{{nameDraft}}" onInput="{{onNameInput}}">
</div>
</div>
<div class="pm-glass-dark" aria-live="polite" style="border-radius: 9999px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f0b37a" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto" aria-hidden="true"><path d="M3 17h18M6 17a6 6 0 0 1 12 0M12 5v2M5.6 7.6l1.4 1.4M18.4 7.6 17 9"></path></svg>
<span style="color: #c2c2c2">Prévia:</span><span style="font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{namePreview}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<button type="submit" class="pm-cta">Entrar no painel<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
<button type="button" class="pm-link" onClick="{{skipName}}">Continuar sem nome</button>
</div>
<div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #c2c2c2">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c2c2c2" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"></path></svg>Seu nome fica salvo só neste navegador.
</div>
</form>
</div>
</div>
</template>
<template data-if="showPanel">
<header style="position: relative; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 24px 8px">
<div class="pm-fade" style="display: flex; align-items: center; gap: 10px">
<div class="pm-glass" style="width: 40px; height: 40px; border-radius: 9999px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ededed" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M3 17h18M6 17a6 6 0 0 1 12 0M12 5v2M5.6 7.6l1.4 1.4M18.4 7.6 17 9"></path></svg>
</div>
<div style="display: flex; flex-direction: column; line-height: 1.25">
<span style="font-size: 15px; font-weight: 500; letter-spacing: -0.01em">Painel Macro Brasil</span>
<span style="font-size: 12px; color: #c2c2c2; display: flex; align-items: center; gap: 6px"><span class="pm-pulse" style="width: 6px; height: 6px; border-radius: 9999px; background: #ededed"></span>Dados do Banco Central</span>
</div>
</div>

<nav class="pm-topnav pm-fade" aria-label="Seções do painel" style="display: flex; gap: 8px; justify-content: center; flex-wrap: nowrap">
<template data-for="nav" data-as="n">
<button type="button" class="{{n.pillClass}}" onClick="{{n.go}}" aria-current="{{n.current}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>{{n.label}}
</button>
</template>
</nav>

<div style="display: flex; align-items: center; gap: 8px; position: relative">
<button type="button" class="pm-pill" aria-label="Alertas" aria-expanded="{{notifOpen}}" onClick="{{toggleNotif}}" style="width: 40px; height: 40px; padding: 0; justify-content: center; position: relative">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9M10 20a2 2 0 0 0 4 0"></path></svg>
<span style="position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; border-radius: 9999px; background: #ededed; color: #161616; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{alertCount}}</span>
</button>
<button type="button" class="pm-avatar" title="Trocar nome" aria-label="Trocar o nome da saudação" onClick="{{changeName}}"><template data-if="hasName">{{initials}}</template><template data-if="noName"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0"></path></svg></template></button>
<template data-if="notifOpen">
<div class="pm-glass-dark pm-rise" role="region" aria-label="Alertas" style="position: absolute; top: 52px; right: 0; width: 330px; max-width: calc(100vw - 48px); border-radius: 24px; padding: 18px; z-index: 10; display: flex; flex-direction: column; gap: 12px; animation-duration: .5s">
<span style="font-size: 13px; color: #c2c2c2; letter-spacing: .02em">Alertas</span>
<template data-for="alerts" data-as="a">
<div style="display: flex; gap: 10px; align-items: flex-start">
<span style="{{a.dotStyle}}"></span>
<span style="font-size: 14px; color: #ededed">{{a.text}}</span>
</div>
</template>
</div>
</template>
</div>
</header>

<div style="position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 24px; padding: 16px 24px 40px; align-items: flex-start">
<nav class="pm-dock pm-glass pm-fade" aria-label="Navegação lateral" style="position: relative; z-index: 6; flex: 0 0 auto; width: 56px; box-sizing: border-box; padding: 8px; border-radius: 9999px; display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 88px">
<template data-for="nav" data-as="n">
<button type="button" class="{{n.dockClass}}" onClick="{{n.go}}" aria-label="{{n.label}}" aria-current="{{n.current}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
<span class="pm-tip pm-glass-dark" aria-hidden="true" style="padding: 6px 12px; border-radius: 9999px; font-size: 13px; color: #ededed">{{n.label}}</span>
</button>
</template>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

<template data-if="isOverview">
<section aria-labelledby="t-overview" style="display: flex; flex-direction: column; gap: 20px">

<div class="pm-rise" style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="min-width: 0">
<h1 id="t-overview" style="margin: 0; font-size: 40px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.1">{{greeting}}{{greetSuffix}}</h1>
<p style="margin: 8px 0 0; font-size: 15px; color: #c2c2c2">{{subtitle}}</p>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span class="pm-pill" style="cursor: default">Próximo Copom: {{copomShort}}</span>
<a href="https://www.bcb.gov.br/publicacoes/focus" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 9999px; background: #ffffff; color: #161616; font-size: 14px; font-weight: 500; text-decoration: none">Abrir o Focus da semana<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<template data-for="kpis" data-as="k">
<article class="pm-glass pm-lift pm-rise" style="{{k.cardStyle}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 13px; color: #c2c2c2; letter-spacing: .02em">{{k.label}}</span>
<span class="pm-glass" style="width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9999px; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="{{k.icon}}"></path></svg></span>
</div>
<div style="font-size: 34px; font-weight: 500; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums">{{k.display}}</div>
<div style="font-size: 13px; color: #c2c2c2; min-height: 40px">{{k.note}}</div>
<template data-if="k.hasSpark">
<svg viewBox="0 0 200 40" preserveAspectRatio="none" style="width: 100%; height: 40px; display: block" aria-hidden="true">
<path d="{{k.area}}" fill="{{k.color}}" style="opacity: .12"></path>
<path class="pm-fade" d="{{k.line}}" fill="none" stroke="{{k.color}}" style="stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round"></path>
</svg>
</template>
<template data-if="k.noSpark">
<div class="pm-glass-dark" style="border-radius: 9999px; padding: 8px 12px; font-size: 13px; color: #ededed; text-align: center">{{k.foot}}</div>
</template>
</article>
</template>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<article class="pm-glass pm-rise" aria-labelledby="t-bars" style="flex: 2 1 560px; min-width: 0; box-sizing: border-box; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px; animation-delay: 420ms">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start">
<div>
<h2 id="t-bars" style="margin: 0; font-family: Geist, 'DM Sans', sans-serif; font-size: 20px; font-weight: 500; letter-spacing: -0.01em">Juro real ao fim de cada ano</h2>
<p style="margin: 4px 0 0; font-size: 14px; color: #c2c2c2">Selic do fim do ano descontada a inflação de 12 meses (fórmula de Fisher) · {{barsNowTxt}}</p>
</div>
<div class="pm-glass-dark" style="border-radius: 9999px; padding: 8px 14px; font-size: 13px; color: #ededed; font-variant-numeric: tabular-nums">{{barDetail}}</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #c2c2c2">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: rgba(237,237,237,.32); border: 1px solid rgba(255,255,255,.4)"></span>Juro real no ano</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #8fb0ff"></span>Hoje</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 16px; height: 0; border-top: 2px dashed rgba(240,179,122,.9)"></span>Juro neutro de referência ({{neutroTxt}})</span>
</div>
<svg viewBox="0 0 760 292" style="width: 100%; height: auto; display: block; overflow: visible" role="img" aria-label="Gráfico de barras do juro real ao fim de cada ano, de {{barsFrom}} a {{barsTo}}">
<template data-for="barTicks" data-as="t">
<line x1="56" x2="736" y1="{{t.y}}" y2="{{t.y}}" stroke="rgba(255,255,255,.08)" style="stroke-width: 1"></line>
<text x="46" y="{{t.ty}}" fill="#c2c2c2" style="font-size: 12px; text-anchor: end">{{t.label}}</text>
</template>
<line x1="56" x2="736" y1="{{zeroY}}" y2="{{zeroY}}" stroke="rgba(255,255,255,.35)" style="stroke-width: 1"></line>
<template data-for="bars" data-as="b">
<g>
<template data-if="b.isNow">
<rect x="{{b.x}}" y="{{b.y}}" width="{{b.w}}" height="{{b.h}}" rx="10" fill="#8fb0ff" style="opacity: .45; filter: blur(12px)"></rect>
</template>
<rect class="{{b.cls}}" x="{{b.x}}" y="{{b.y}}" width="{{b.w}}" height="{{b.h}}" rx="10" fill="{{b.fill}}" stroke="rgba(255,255,255,.38)" style="{{b.style}}" onMouseEnter="{{b.enter}}" onClick="{{b.enter}}"></rect>
<text class="pm-fade" x="{{b.cx}}" y="{{b.ly}}" fill="#ededed" style="{{b.labelStyle}}">{{b.valueTxt}}</text>
<text x="{{b.cx}}" y="280" fill="#c2c2c2" style="font-size: 12px; text-anchor: middle">{{b.year}}</text>
</g>
</template>
<line x1="56" x2="736" y1="{{neutroY}}" y2="{{neutroY}}" stroke="rgba(240,179,122,.9)" style="stroke-width: 1.5; stroke-dasharray: 6 6"></line>
</svg>
<p style="margin: 0; font-size: 13px; color: #c2c2c2">Passe o mouse nas barras para ver a conta de cada ano. Em 2020 e 2021 o juro real ficou negativo: a inflação passou da Selic.</p>
</article>

<article class="pm-glass pm-rise" aria-labelledby="t-copom" style="flex: 1 1 300px; min-width: 0; box-sizing: border-box; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; animation-delay: 520ms">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<h2 id="t-copom" style="margin: 0; font-family: Geist, 'DM Sans', sans-serif; font-size: 20px; font-weight: 500; letter-spacing: -0.01em">Próximo Copom</h2>
<span class="pm-glass-dark" style="border-radius: 9999px; padding: 6px 12px; font-size: 13px">Selic hoje {{selicTxt}}</span>
</div>
<div>
<div style="display: flex; align-items: baseline; gap: 10px"><span style="font-size: 64px; font-weight: 500; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums">{{copomDays}}</span><span style="font-size: 18px; color: #c2c2c2">{{copomWord}}</span></div>
<p style="margin: 6px 0 0; font-size: 14px; color: #c2c2c2">{{copomWhen}}</p>
</div>
<div class="pm-glass-dark" style="border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: #c2c2c2">O que o mercado precifica</span>
<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 500; letter-spacing: -0.03em">{{selicTxt}}</span><span style="font-size: 12px; color: #c2c2c2">Selic hoje</span></div>
<svg width="28" height="14" viewBox="0 0 28 14" fill="none" stroke="#c2c2c2" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M2 7h23M19 2l6 5-6 5"></path></svg>
<div style="display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 500; letter-spacing: -0.03em; color: #8fb0ff">{{copomFocusTxt}}</span><span style="font-size: 12px; color: #c2c2c2">{{copomFocusLabel}}</span></div>
</div>
<p style="margin: 0; font-size: 13px; color: #c2c2c2">{{copomPricing}}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #c2c2c2; letter-spacing: .02em">Próximos eventos</span>
<template data-for="events" data-as="ev">
<div class="pm-glass-dark pm-row pm-rise" style="{{ev.rowStyle}}">
<div style="display: flex; flex-direction: column; align-items: center; width: 40px; flex: 0 0 auto"><span style="font-size: 18px; font-weight: 500; line-height: 1.1">{{ev.day}}</span><span style="font-size: 11px; color: #c2c2c2">{{ev.month}}</span></div>
<span style="{{ev.accent}}"></span>
<div style="min-width: 0"><div style="font-size: 14px; font-weight: 500">{{ev.title}}</div><div style="font-size: 12px; color: #c2c2c2">{{ev.desc}}</div></div>
</div>
</template>
</div>
</article>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<article class="pm-glass pm-rise" aria-labelledby="t-infl" style="flex: 2 1 560px; min-width: 0; box-sizing: border-box; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px; animation-delay: 620ms">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start">
<div>
<h2 id="t-infl" style="margin: 0; font-family: Geist, 'DM Sans', sans-serif; font-size: 20px; font-weight: 500; letter-spacing: -0.01em">Inflação contra a meta</h2>
<p style="margin: 4px 0 0; font-size: 14px; color: #c2c2c2">IPCA em 12 meses, com a meta e a banda de tolerância de cada ano</p>
</div>
<div class="pm-glass-dark" role="group" aria-label="Período do gráfico" style="display: flex; gap: 4px; padding: 4px; border-radius: 9999px">
<template data-for="segs" data-as="sg">
<button type="button" class="{{sg.cls}}" onClick="{{sg.pick}}" aria-pressed="{{sg.on}}">{{sg.label}}</button>
</template>
</div>
</div>
<svg viewBox="0 0 760 262" style="width: 100%; height: auto; display: block; overflow: visible" role="img" aria-label="Gráfico de linha do IPCA em 12 meses com a banda da meta de inflação">
<path d="{{infl.band}}" fill="rgba(237,237,237,.10)"></path>
<path d="{{infl.center}}" fill="none" stroke="rgba(237,237,237,.45)" style="stroke-width: 1; stroke-dasharray: 4 5"></path>
<template data-for="infl.ticks" data-as="t">
<line x1="48" x2="700" y1="{{t.y}}" y2="{{t.y}}" stroke="rgba(255,255,255,.07)" style="stroke-width: 1"></line>
<text x="40" y="{{t.ty}}" fill="#c2c2c2" style="font-size: 12px; text-anchor: end">{{t.label}}</text>
</template>
<template data-for="infl.xlabels" data-as="xl">
<text x="{{xl.x}}" y="252" fill="#c2c2c2" style="font-size: 12px; text-anchor: middle">{{xl.label}}</text>
</template>
<path class="pm-draw" pathLength="1" d="{{infl.line}}" fill="none" stroke="#f0b37a" style="stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round"></path>
<circle class="pm-fade" cx="{{infl.lastX}}" cy="{{infl.lastY}}" r="5" fill="#f0b37a" stroke="#0a0a0a" style="stroke-width: 2; animation-delay: 1.4s"></circle>
<text class="pm-fade" x="{{infl.labelX}}" y="{{infl.labelY}}" fill="#ededed" style="font-size: 13px; font-weight: 500; animation-delay: 1.5s">{{infl.lastTxt}}</text>
</svg>
<div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #c2c2c2">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 16px; height: 0; border-top: 2.5px solid #f0b37a"></span>IPCA 12 meses</span>

<div class="pm-glass-dark pm-row" style="border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 14px"><span style="font-weight: 500">{{m.name}}</span><span style="font-variant-numeric: tabular-nums">{{m.change}}</span></div>
<span style="font-size: 12px; color: #c2c2c2">{{m.read}}</span>
</div>
</template>
</article>
</div>

<article class="pm-glass pm-rise" aria-labelledby="t-q" style="border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 12px; animation-delay: 360ms">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline">
<h2 id="t-q" style="margin: 0; font-family: Geist, 'DM Sans', sans-serif; font-size: 20px; font-weight: 500">Perguntas para ler o Focus</h2>
<span style="font-size: 13px; color: #c2c2c2; font-variant-numeric: tabular-nums">{{checksDone}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px">
<template data-for="questions" data-as="q">
<label class="pm-glass-dark pm-row" style="border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 14px">
<input class="pm-check" type="checkbox" checked="{{q.checked}}" onChange="{{q.toggle}}">
<span>{{q.text}}</span>
</label>
</template>
</div>
</article>
</section>
</template>

<template data-if="isAgenda">
<section aria-labelledby="t-agenda" style="display: flex; flex-direction: column; gap: 20px">
<div class="pm-rise">
<h1 id="t-agenda" style="margin: 0; font-size: 40px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.1">Agenda macro</h1>
<p style="margin: 8px 0 0; font-size: 15px; color: #c2c2c2">{{agendaSub}}</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<article class="pm-glass pm-rise" aria-labelledby="t-cal" style="flex: 2 1 520px; min-width: 0; box-sizing: border-box; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px; animation-delay: 100ms">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center">
<h2 id="t-cal" style="margin: 0; font-family: Geist, 'DM Sans', sans-serif; font-size: 20px; font-weight: 500">{{agendaMonth}}</h2>
<div style="display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: #c2c2c2">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 9999px; background: #8fb0ff"></span>Focus</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 9999px; background: #f0b37a"></span>Copom</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 9999px; background: #ededed"></span>Ata</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 9999px; border: 1px solid #c2c2c2"></span>Feriado</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 12px; color: #c2c2c2; text-align: center">
<span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<template data-for="calendar" data-as="d">
<template data-if="d.blank"><span aria-hidden="true"></span></template>
<template data-if="d.real">
<button type="button" class="{{d.cls}}" onClick="{{d.pick}}" aria-pressed="{{d.on}}" aria-label="{{d.aria}}" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0">
<span style="font-size: 15px; font-variant-numeric: tabular-nums">{{d.n}}</span>
<span style="display: flex; gap: 3px; height: 6px">
<template data-for="d.dots" data-as="dt"><span style="{{dt.style}}"></span></template>
</span>
</button>
</template>
</template>
</div>
</article>

<article class="pm-glass pm-rise" aria-labelledby="t-dayinfo" style="flex: 1 1 300px; min-width: 0; box-sizing: border-box; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 12px; animation-delay: 200ms">
<h2 id="t-dayinfo" style="margin: 0; font-family: Geist, 'DM Sans', sans-serif; font-size: 20px; font-weight: 500">{{dayTitle}}</h2>
<template data-if="dayEmpty">
<p style="margin: 0; font-size: 14px; color: #c2c2c2">Nenhum evento macro neste dia.</p>
</template>
<template data-for="dayEvents" data-as="ev">
<div class="pm-glass-dark pm-rise" style="border-radius: 16px; padding: 14px; display: flex; gap: 12px; animation-duration: .6s">
<span style="{{ev.accent}}"></span>
<div><div style="font-size: 15px; font-weight: 500">{{ev.title}}</div><div style="font-size: 13px; color: #c2c2c2">{{ev.desc}}</div></div>
</div>
</template>
<h3 style="margin: 12px 0 0; font-size: 13px; font-weight: 500; color: #c2c2c2; letter-spacing: .02em">{{nextMonthName}}</h3>
<template data-for="december" data-as="ev">
<div class="pm-row" style="display: flex; gap: 12px; align-items: center; padding: 6px 4px; border-radius: 12px">
<span style="width: 56px; flex: 0 0 auto; white-space: nowrap; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums">{{ev.day}}</span>
<span style="{{ev.accent}}"></span>
<span style="font-size: 14px">{{ev.title}}</span>
</div>
</template>
</article>
</div>
</section>
</template>

<template data-if="isMetodo">
<section aria-labelledby="t-met" style="display: flex; flex-direction: column; gap: 20px">
<div class="pm-rise">
<h1 id="t-met" style="margin: 0; font-size: 40px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.1">Metodologia</h1>
<p style="margin: 8px 0 0; font-size: 15px; color: #c2c2c2">De onde vêm os números e como cada um é calculado</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<article class="pm-glass pm-rise" aria-labelledby="t-src" style="flex: 3 1 520px; min-width: 0; box-sizing: border-box; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 12px; animation-delay: 100ms">
<h2 id="t-src" style="margin: 0; font-family: Geist, 'DM Sans', sans-serif; font-size: 20px; font-weight: 500">Fontes dos dados</h2>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 520px; border-collapse: collapse; font-size: 14px">
<thead><tr style="color: #c2c2c2; text-align: left; font-size: 13px"><th scope="col" style="padding: 10px; font-weight: 500">Série</th><th scope="col" style="padding: 10px; font-weight: 500">Origem</th><th scope="col" style="padding: 10px; font-weight: 500">Frequência</th><th scope="col" style="padding: 10px; font-weight: 500">Última leitura</th></tr></thead>
<tbody>
<tr class="pm-row" style="border-top: 1px solid rgba(229,229,229,.12)"><th scope="row" style="padding: 12px 10px; text-align: left; font-weight: 500">Meta Selic</th><td style="padding: 12px 10px">SGS 432</td><td style="padding: 12px 10px">Muda a cada Copom</td><td style="padding: 12px 10px">{{metSelic}}</td></tr>
<tr class="pm-row" style="border-top: 1px solid rgba(229,229,229,.12)"><th scope="row" style="padding: 12px 10px; text-align: left; font-weight: 500">IPCA em 12 meses</th><td style="padding: 12px 10px">SGS 13522</td><td style="padding: 12px 10px">Mensal</td><td style="padding: 12px 10px">{{metIpca}}</td></tr>
<tr class="pm-row" style="border-top: 1px solid rgba(229,229,229,.12)"><th scope="row" style="padding: 12px 10px; text-align: left; font-weight: 500">Expectativas de mercado</th><td style="padding: 12px 10px">Boletim Focus</td><td style="padding: 12px 10px">Semanal</td><td style="padding: 12px 10px">{{metFocus}}</td></tr>
<tr class="pm-row" style="border-top: 1px solid rgba(229,229,229,.12)"><th scope="row" style="padding: 12px 10px; text-align: left; font-weight: 500">Ibovespa</th><td style="padding: 12px 10px">Yahoo Finance via yfinance (^BVSP)</td><td style="padding: 12px 10px">Diária</td><td style="padding: 12px 10px">{{metIbov}}</td></tr>
<tr class="pm-row" style="border-top: 1px solid rgba(229,229,229,.12)"><th scope="row" style="padding: 12px 10px; text-align: left; font-weight: 500">Índice do medo</th><td style="padding: 12px 10px">S&amp;P/B3 Ibovespa VIX (S&amp;P Dow Jones e B3)</td><td style="padding: 12px 10px">Diária</td><td style="padding: 12px 10px">{{metMedo}}</td></tr>
<tr class="pm-row" style="border-top: 1px solid rgba(229,229,229,.12)"><th scope="row" style="padding: 12px 10px; text-align: left; font-weight: 500">Atualização</th><td style="padding: 12px 10px">GitHub Actions + coletar.py</td><td style="padding: 12px 10px">Dias úteis, 10h</td><td style="padding: 12px 10px">{{metUpdated}}</td></tr>
</tbody>
</table>
</div>
<div class="pm-glass-dark" style="border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #c2c2c2">Juro real pela fórmula de Fisher</span>
<span style="font-size: 20px; font-weight: 500; letter-spacing: -0.01em">Juro real = (1 + Selic) ÷ (1 + IPCA) − 1</span>
<span style="font-size: 14px; color: #c2c2c2">{{fisherExample}}</span>
</div>
<p style="margin: 0; font-size: 13px; color: #c2c2c2">Para comparar uma série diária (Selic) com uma mensal (IPCA), o painel usa a Selic do último dia de cada mês. O juro real esperado usa as medianas do Focus para o mesmo ano.</p>
</article>

<article class="pm-glass pm-rise" aria-labelledby="t-diff" style="flex: 2 1 320px; min-width: 0; box-sizing: border-box; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 4px; animation-delay: 200ms">
<h2 id="t-diff" style="margin: 0 0 8px; font-family: Geist, 'DM Sans', sans-serif; font-size: 20px; font-weight: 500">O que este painel faz diferente</h2>
<template data-for="diffs" data-as="df">
<div class="pm-row" style="display: flex; justify-content: space-between; gap: 16px; padding: 10px 4px; border-radius: 12px">
<span style="font-size: 15px; color: #ededed">{{df.text}}</span>
<span style="font-size: 15px; color: #c2c2c2; font-variant-numeric: tabular-nums">{{df.n}}</span>
</div>
</template>
</article>
</div>
</section>
</template>

<footer class="pm-fade" style="font-size: 12px; color: rgba(237,237,237,.72); padding: 4px 4px 0; animation-delay: 1s">{{footer}}</footer>
</main>
</div>
</template>
</div>
</template>

<script src="js/manual.js"></script>
<script src="js/motor.js"></script>
<script src="js/painel.js"></script>
</body>
</html>
