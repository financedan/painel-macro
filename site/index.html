<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Macro Brasil</title>
<!-- meta:inicio (gerado pelo coletar.py) -->
<meta name="description" content="Selic 13,75% · IPCA 12 meses 4,63% · juro real 8,72% · Ibovespa 172.458 pontos. Dados do Banco Central, IBGE e B3, atualizados todo dia útil.">
<meta property="og:title" content="Painel Macro Brasil">
<meta property="og:description" content="Selic 13,75% · IPCA 12 meses 4,63% · juro real 8,72% · Ibovespa 172.458 pontos.">
<meta property="og:image" content="https://financedan.github.io/painel-macro/img/og.png">
<meta property="og:url" content="https://financedan.github.io/painel-macro/">
<meta name="twitter:card" content="summary_large_image">
<!-- meta:fim -->
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="img/icone.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="Painel Macro Brasil" href="feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="css/painel.css" rel="stylesheet">
</head>
<body>
<div id="app"><div class="pm-skel" aria-label="Carregando o painel"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div></div>

<!-- Tela de erro (usada pelo painel.js quando os dados não carregam) -->
<template id="modelo-erro">
<div style="min-height: 100vh; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 24px; background: #0a0a0a url(img/fundo.jpg) center/cover; color: #ededed; font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif">
<div class="pm-glass pm-welcome-card" role="alert">
<span style="font-size: 12px; font-weight: 500; letter-spacing: .12em; color: #f0b37a">PAINEL MACRO BRASIL</span>
<h1 style="margin: 0; font-size: 32px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.15">Os dados não carregaram</h1>
<p data-msg style="margin: 0; font-size: 15px; line-height: 1.5; color: #c2c2c2"></p>
<button type="button" class="pm-cta">Tentar de novo</button>
</div>
</div>
</template>

<!-- Modelo do painel: os {{campos}} são preenchidos pelos arquivos em js/secoes -->
<template id="modelo">
<div class="{{rootClass}}" style="position: relative; min-height: 100vh; color: #ededed; font-family: 'DM Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.5; overflow-x: hidden; isolation: isolate">
<div class="pm-bg" aria-hidden="true">
<div class="pm-scene pm-scene-dusk pm-scene-on"></div>
</div>
<div class="pm-veil" aria-hidden="true"></div>

<template data-if="askName">
<div class="pm-welcome" style="position: relative; z-index: 5; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; padding: 20px 24px 32px">
<div class="pm-fade" style="display: flex; align-items: center; gap: 10px">
<div class="pm-glass" style="width: 40px; height: 40px; border-radius: 9999px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ededed" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M3 17h18M6 17a6 6 0 0 1 12 0M12 5v2M5.6 7.6l1.4 1.4M18.4 7.6 17 9"></path></svg></div>
<div style="display: flex; flex-direction: column; line-height: 1.25">
<span style="font-size: 15px; font-weight: 500; letter-spacing: -0.01em">Painel Macro Brasil</span>
<span style="font-size: 12px; color: #c2c2c2; display: flex; align-items: center; gap: 6px"><span class="pm-pulse" style="width: 6px; height: 6px; border-radius: 9999px; background: #ededed"></span>Dados do Banco Central, IBGE e B3</span>
</div>
</div>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 0">
<form class="pm-glass pm-rise pm-welcome-card" aria-labelledby="t-welcome" onSubmit="{{saveName}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 500; letter-spacing: .12em; color: #f0b37a">SAUDAÇÃO</span>
<h1 id="t-welcome" style="margin: 0; font-size: 38px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.1">Como podemos te chamar?</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #c2c2c2">Seu nome aparece na saudação do painel: Bom dia, Boa tarde ou Boa noite, conforme o horário.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pm-nome" style="font-size: 13px; color: #c2c2c2; letter-spacing: .02em">Seu nome</label>
<div class="pm-glass-dark pm-field">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c2c2c2" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0"></path></svg>
<input id="pm-nome" class="pm-input" type="text" maxlength="30" autocomplete="given-name" placeholder="Ex.: Daniel" value="{{nameDraft}}" onInput="{{onNameInput}}">
</div>
</div>
<div class="pm-glass-dark" aria-live="polite" style="border-radius: 9999px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f0b37a" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto" aria-hidden="true"><path d="M3 17h18M6 17a6 6 0 0 1 12 0M12 5v2M5.6 7.6l1.4 1.4M18.4 7.6 17 9"></path></svg>
<span style="color: #c2c2c2">Prévia:</span><span style="font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{namePreview}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<button type="submit" class="pm-cta"><template data-if="primeiraVez">Entrar no painel</template><template data-if="depoisDaPrimeira">Salvar e voltar ao painel</template><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
<div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center">
<template data-if="primeiraVez"><button type="button" class="pm-link" onClick="{{skipName}}">Continuar sem nome</button></template>
<template data-if="depoisDaPrimeira"><button type="button" class="pm-link" onClick="{{cancelName}}">Cancelar</button></template>
<template data-if="nameHasSaved"><button type="button" class="pm-link" onClick="{{removeName}}">Remover meu nome</button></template>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #c2c2c2">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c2c2c2" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"></path></svg>Seu nome fica salvo só neste navegador.
</div>
</form>
</div>
</div>
</template>

<template data-if="showPanel">
<header style="position: relative; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 24px 8px">
<div class="pm-fade" style="display: flex; align-items: center; gap: 10px">
<div class="pm-glass" style="width: 40px; height: 40px; border-radius: 9999px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ededed" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M3 17h18M6 17a6 6 0 0 1 12 0M12 5v2M5.6 7.6l1.4 1.4M18.4 7.6 17 9"></path></svg>
</div>
<div style="display: flex; flex-direction: column; line-height: 1.25">
<span style="font-size: 15px; font-weight: 500; letter-spacing: -0.01em">Painel Macro Brasil</span>
<span style="font-size: 12px; color: #c2c2c2; display: flex; align-items: center; gap: 6px"><span class="pm-pulse" style="width: 6px; height: 6px; border-radius: 9999px; background: #ededed"></span>Dados do Banco Central, IBGE e B3</span>
</div>
</div>

<nav class="pm-topnav pm-fade" aria-label="Seções do painel" style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap">
<template data-for="nav" data-as="n">
<a href="{{n.href}}" class="{{n.pillClass}}" onClick="{{n.go}}" aria-current="{{n.current}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>{{n.label}}
</a>
</template>
</nav>

<div style="display: flex; align-items: center; gap: 8px; position: relative">
<button type="button" data-sino class="pm-pill" aria-label="{{alertLabel}}" aria-expanded="{{notifOpen}}" aria-controls="pm-alertas" onClick="{{toggleNotif}}" style="width: 40px; height: 40px; padding: 0; justify-content: center; position: relative">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9M10 20a2 2 0 0 0 4 0"></path></svg>
<template data-if="hasNewAlerts"><span aria-hidden="true" style="position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; border-radius: 9999px; background: #ededed; color: #161616; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{alertCount}}</span></template>
</button>
<button type="button" class="pm-avatar" title="Trocar nome" aria-label="Definir o nome da saudação" onClick="{{changeName}}"><template data-if="hasName">{{initials}}</template><template data-if="noName"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0"></path></svg></template></button>
<template data-if="notifOpen">
<div id="pm-alertas" data-alertas class="pm-glass-dark pm-rise" role="region" aria-label="Alertas" style="position: absolute; top: 52px; right: 0; width: 340px; max-width: calc(100vw - 48px); border-radius: 24px; padding: 18px; z-index: 10; display: flex; flex-direction: column; gap: 12px; animation-duration: .5s">
<span style="font-size: 13px; color: #c2c2c2; letter-spacing: .02em">Alertas<template data-if="hasNovidades"> · {{novidadesTitulo}}</template></span>
<template data-for="alerts" data-as="a">
<div style="display: flex; gap: 10px; align-items: flex-start">
<span style="{{a.dotStyle}}"></span>
<span style="font-size: 14px; color: #ededed"><template data-if="a.novidade"><span class="pm-tag">novo</span></template>{{a.text}}</span>
</div>
</template>
<span style="font-size: 12px; color: #c2c2c2">Esc ou clique fora para fechar</span>
</div>
</template>
</div>
</header>

<div style="position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 24px; padding: 16px 24px 40px; align-items: flex-start">
<nav class="pm-dock pm-glass pm-fade" aria-label="Navegação" style="position: relative; z-index: 6; flex: 0 0 auto; width: 56px; box-sizing: border-box; padding: 8px; border-radius: 9999px; display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 88px">
<template data-for="nav" data-as="n">
<a href="{{n.href}}" class="{{n.dockClass}}" onClick="{{n.go}}" aria-label="{{n.label}}" aria-current="{{n.current}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
<span class="pm-tip pm-glass-dark" aria-hidden="true" style="padding: 6px 12px; border-radius: 9999px; font-size: 13px; color: #ededed">{{n.label}}</span>
</a>
</template>
</nav>

<main class="pm-main" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

<template data-if="hasAvisos">
<div class="pm-glass-dark pm-fade" role="status" style="border-radius: 18px; display: flex; flex-direction: column; gap: 6px; padding: 4px 0">
<template data-for="avisos" data-as="av"><div class="pm-aviso">{{av.t}}</div></template>
</div>
</template>

<!-- ======================================================== VISÃO GERAL -->
<template data-if="isVisao">
<section aria-labelledby="t-overview" style="display: flex; flex-direction: column; gap: 20px">

<div class="pm-rise" style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="min-width: 0">
<h1 id="t-overview" class="pm-h1">{{greeting}}{{greetSuffix}}</h1>
<p style="margin: 8px 0 0; font-size: 15px; color: #c2c2c2">{{subtitle}}</p>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span class="pm-pill" style="cursor: default">{{copomShort}}</span>
<a href="https://www.bcb.gov.br/publicacoes/focus" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 9999px; background: #ffffff; color: #161616; font-size: 14px; font-weight: 500; text-decoration: none">Abrir o Focus da semana<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
</div>
</div>



<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<template data-for="kpis" data-as="k">
<article class="pm-glass pm-rise" style="border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; {{k.cardStyle}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 13px; color: #c2c2c2; letter-spacing: .02em">{{k.label}}</span>
<span class="pm-glass" style="width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9999px; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="{{k.icon}}"></path></svg></span>
</div>
<div style="font-size: 34px; font-weight: 500; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums">{{k.display}}</div>
<div style="font-size: 13px; color: #c2c2c2; min-height: 40px">{{k.note}}</div>
<template data-if="k.hasSpark">
<svg viewBox="0 0 200 40" preserveAspectRatio="none" style="width: 100%; height: 40px; display: block; margin-top: auto" aria-hidden="true">
<path d="{{k.area}}" fill="{{k.color}}" style="opacity: .12"></path>
<path d="{{k.line}}" fill="none" stroke="{{k.color}}" style="stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round"></path>
</svg>
</template>
<template data-if="k.noSpark">
<div class="pm-glass-dark" style="border-radius: 9999px; padding: 8px 12px; font-size: 13px; color: #ededed; text-align: center; margin-top: auto">{{k.foot}}</div>
</template>
</article>
</template>
</div>

<div class="pm-linha">
<template data-if="barrasOk">
<article class="pm-glass pm-rise pm-card" aria-labelledby="t-bars" style="flex: 2 1 560px; animation-delay: 420ms">
<div class="pm-cab">
<div>
<h2 id="t-bars" class="pm-h2">Juro real ao fim de cada ano</h2>
<p class="pm-sub">Selic do fim do ano descontada a inflação de 12 meses (fórmula de Fisher) · {{barsNowTxt}}</p>
</div>
<div class="pm-cab-dir">
<div class="pm-glass-dark pm-chip">{{barDetail}}</div>
<button type="button" class="{{aj.juroReal.cls}}" onClick="{{aj.juroReal.toggle}}" aria-expanded="{{aj.juroReal.aberto}}" aria-label="O que é juro real?">?</button>
</div>
</div>
<template data-if="aj.juroReal.on"><p class="pm-glass-dark pm-explica">{{aj.juroReal.txt}} {{aj.neutro.txt}}</p></template>
<div class="pm-leg">
<span><span style="width: 12px; height: 12px; border-radius: 4px; background: rgba(237,237,237,.32); border: 1px solid rgba(255,255,255,.4)"></span>Juro real no ano</span>
<span><span style="width: 12px; height: 12px; border-radius: 4px; background: #8fb0ff"></span>Hoje (* ano em curso)</span>
<span><span style="width: 16px; height: 0; border-top: 2px dashed rgba(240,179,122,.9)"></span>Juro neutro de referência ({{neutroTxt}})</span>
</div>
<div class="pm-rola">
<svg viewBox="0 0 760 292" style="width: 100%; height: auto; display: block; overflow: visible" role="img" aria-label="Gráfico de barras do juro real ao fim de cada ano, de {{barsFrom}} a {{barsTo}}">
<template data-for="barTicks" data-as="t">
<line x1="56" x2="736" y1="{{t.y}}" y2="{{t.y}}" stroke="rgba(255,255,255,.08)" style="stroke-width: 1"></line>
<text x="46" y="{{t.ty}}" fill="#c2c2c2" style="font-size: 12px; text-anchor: end">{{t.label}}</text>
</template>
<line x1="56" x2="736" y1="{{zeroY}}" y2="{{zeroY}}" stroke="rgba(255,255,255,.35)" style="stroke-width: 1"></line>
<template data-for="bars" data-as="b">
<g>
<template data-if="b.isNow">
<rect x="{{b.x}}" y="{{b.y}}" width="{{b.w}}" height="{{b.h}}" rx="10" fill="#8fb0ff" style="opacity: .45; filter: blur(12px)"></rect>
</template>
<rect class="{{b.cls}}" x="{{b.x}}" y="{{b.y}}" width="{{b.w}}" height="{{b.h}}" rx="10" fill="{{b.fill}}" stroke="rgba(255,255,255,.38)" style="{{b.style}}" tabindex="0" role="button" aria-label="{{b.aria}}" onMouseEnter="{{b.enter}}" onClick="{{b.enter}}" onFocus="{{b.enter}}"></rect>
<text class="pm-fade" x="{{b.cx}}" y="{{b.ly}}" fill="#ededed" style="{{b.labelStyle}}">{{b.valueTxt}}</text>
<text x="{{b.cx}}" y="280" fill="#c2c2c2" style="font-size: 12px; text-anchor: middle">{{b.year}}</text>
</g>
</template>
<line x1="56" x2="736" y1="{{neutroY}}" y2="{{neutroY}}" stroke="rgba(240,179,122,.9)" style="stroke-width: 1.5; stroke-dasharray: 6 6"></line>
</svg>
</div>
<div class="pm-rola-dica" aria-hidden="true">Arraste para o lado ↔</div>
<p class="pm-cap">{{barsCaption}}</p>
</article>
</template>

<template data-if="copomOk">
<article class="pm-glass pm-rise pm-card" aria-labelledby="t-copom" style="flex: 1 1 300px; gap: 16px; animation-delay: 520ms">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<h2 id="t-copom" class="pm-h2">Próximo Copom</h2>
<div class="pm-cab-dir">
<span class="pm-glass-dark" style="border-radius: 9999px; padding: 6px 12px; font-size: 13px">Selic hoje {{selicTxt}}</span>
<button type="button" class="{{aj.copom.cls}}" onClick="{{aj.copom.toggle}}" aria-expanded="{{aj.copom.aberto}}" aria-label="O que é o Copom?">?</button>
</div>
</div>
<template data-if="aj.copom.on"><p class="pm-glass-dark pm-explica">{{aj.copom.txt}}</p></template>
<div>
<div style="display: flex; align-items: baseline; gap: 10px"><span class="pm-regressiva" style="font-size: 64px; font-weight: 500; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums">{{copomDays}}</span><span style="font-size: 18px; color: #c2c2c2">{{copomWord}}</span></div>
<p style="margin: 6px 0 0; font-size: 14px; color: #c2c2c2">{{copomWhen}}</p>
</div>
<div class="pm-glass-dark" style="border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: #c2c2c2">O que o mercado espera</span>
<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 500; letter-spacing: -0.03em">{{selicTxt}}</span><span style="font-size: 12px; color: #c2c2c2">Selic hoje</span></div>
<svg width="28" height="14" viewBox="0 0 28 14" fill="none" stroke="#c2c2c2" style="stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M2 7h23M19 2l6 5-6 5"></path></svg>
<div style="display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 500; letter-spacing: -0.03em; color: #8fb0ff">{{copomFocusTxt}}</span><span style="font-size: 12px; color: #c2c2c2">{{copomFocusLabel}}</span></div>
</div>
<p class="pm-cap">{{copomPricing}}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #c2c2c2; letter-spacing: .02em">Próximos eventos</span>
<template data-for="events" data-as="ev">
<div class="pm-glass-dark pm-row pm-rise" style="{{ev.rowStyle}}">
<div style="display: flex; flex-direction: column; align-items: center; width: 40px; flex: 0 0 auto"><span style="font-size: 18px; font-weight: 500; line-height: 1.1">{{ev.day}}</span><span style="font-size: 11px; color: #c2c2c2">{{ev.month}}</span></div>
<span style="{{ev.accent}}"></span>
<div style="min-width: 0"><div style="font-size: 14px; font-weight: 500">{{ev.title}}</div><div style="font-size: 12px; color: #c2c2c2">{{ev.desc}}</div></div>
</div>
</template>
</div>
</article>
</template>
</div>

<div class="pm-linha">
<template data-if="inflacaoOk">
<article class="pm-glass pm-rise pm-card" aria-labelledby="t-infl" style="flex: 2 1 560px; animation-delay: 620ms">
<div class="pm-cab">
<div>

<button type="button" class="pm-pill" onClick="{{agendaPrev}}" disabled="{{agendaPrevOff}}" aria-label="Mês anterior" style="width: 36px; height: 36px; padding: 0; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<h2 id="t-cal" class="pm-h2" style="min-width: 140px; text-align: center">{{agendaMonth}}</h2>
<button type="button" class="pm-pill" onClick="{{agendaNext}}" disabled="{{agendaNextOff}}" aria-label="Próximo mês" style="width: 36px; height: 36px; padding: 0; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<template data-if="agendaForaDeHoje"><button type="button" class="pm-pill" onClick="{{agendaHoje}}" style="padding: 6px 12px; font-size: 13px">Hoje</button></template>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: #c2c2c2">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 9999px; background: #8fb0ff"></span>Focus</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 9999px; background: #f0b37a"></span>Copom</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 9999px; background: #ededed"></span>Ata</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 9999px; border: 1px solid #c2c2c2"></span>Feriado<template data-if="hasOutros"> e outros</template></span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 12px; color: #c2c2c2; text-align: center">
<span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<template data-for="calendar" data-as="d">
<template data-if="d.blank"><span aria-hidden="true"></span></template>
<template data-if="d.real">
<button type="button" class="{{d.cls}}" onClick="{{d.pick}}" aria-pressed="{{d.on}}" aria-label="{{d.aria}}" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0">
<span style="font-size: 15px; font-variant-numeric: tabular-nums">{{d.n}}</span>
<span style="display: flex; gap: 3px; height: 6px">
<template data-for="d.dots" data-as="dt"><span style="{{dt.style}}"></span></template>
</span>
</button>
</template>
</template>
</div>
</article>

<article class="pm-glass pm-rise pm-card" aria-labelledby="t-dayinfo" style="flex: 1 1 300px; gap: 12px; animation-delay: 200ms">
<h2 id="t-dayinfo" class="pm-h2">{{dayTitle}}</h2>
<template data-if="dayEmpty">
<p style="margin: 0; font-size: 14px; color: #c2c2c2">Nenhum evento macro neste dia.</p>
</template>
<template data-for="dayEvents" data-as="ev">
<div class="pm-glass-dark pm-rise" style="border-radius: 16px; padding: 14px; display: flex; gap: 12px; animation-duration: .6s">
<span style="{{ev.accent}}"></span>
<div><div style="font-size: 15px; font-weight: 500">{{ev.title}}</div><div style="font-size: 13px; color: #c2c2c2">{{ev.desc}}</div></div>
</div>
</template>
<h3 style="margin: 12px 0 0; font-size: 13px; font-weight: 500; color: #c2c2c2; letter-spacing: .02em">{{nextMonthName}}</h3>
<template data-for="proxMes" data-as="ev">
<div class="pm-row" style="display: flex; gap: 12px; align-items: center; padding: 6px 4px; border-radius: 12px">
<span style="width: 56px; flex: 0 0 auto; white-space: nowrap; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums">{{ev.day}}</span>
<span style="{{ev.accent}}"></span>
<span style="font-size: 14px">{{ev.title}}</span>
</div>
</template>
</article>
</div>
</section>
</template>

<!-- ======================================================== METODOLOGIA -->
<template data-if="isMetodo">
<section aria-labelledby="t-met" style="display: flex; flex-direction: column; gap: 20px">
<div class="pm-rise">
<h1 id="t-met" class="pm-h1">Metodologia</h1>
<p style="margin: 8px 0 0; font-size: 15px; color: #c2c2c2">De onde vêm os números e como cada um é calculado</p>
</div>
<div class="pm-linha">
<article class="pm-glass pm-rise pm-card" aria-labelledby="t-src" style="flex: 3 1 520px; gap: 12px; animation-delay: 100ms">
<h2 id="t-src" class="pm-h2">Fontes dos dados</h2>
<div class="pm-rola-tabela" style="overflow-x: auto">
<table style="width: 100%; min-width: 620px; border-collapse: collapse; font-size: 14px">
<thead><tr style="color: #c2c2c2; text-align: left; font-size: 13px"><th scope="col" style="padding: 10px; font-weight: 500">Série</th><th scope="col" style="padding: 10px; font-weight: 500">Origem</th><th scope="col" style="padding: 10px; font-weight: 500">Frequência</th><th scope="col" style="padding: 10px; font-weight: 500">Última leitura</th><th scope="col" style="padding: 10px; font-weight: 500">Coleta</th></tr></thead>
<tbody>
<template data-for="fontesLinhas" data-as="f">
<tr class="pm-row" style="border-top: 1px solid rgba(229,229,229,.12)"><th scope="row" style="padding: 12px 10px; text-align: left; font-weight: 500">{{f.serie}}</th><td style="padding: 12px 10px"><template data-for="f.origens" data-as="o"><a href="{{o.url}}" target="{{o.alvo}}" rel="noopener">{{o.t}}</a><template data-if="o.sep"> · </template></template></td><td style="padding: 12px 10px">{{f.freq}}</td><td style="padding: 12px 10px">{{f.ultima}}</td><td style="padding: 12px 10px; {{f.stStyle}}">{{f.status}}</td></tr>
</template>
</tbody>
</table>
</div>
<div class="pm-rola-dica" aria-hidden="true">Arraste para o lado ↔</div>
<div class="pm-glass-dark" style="border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #c2c2c2">Juro real pela fórmula de Fisher</span>
<span style="font-size: 20px; font-weight: 500; letter-spacing: -0.01em">Juro real = (1 + Selic) ÷ (1 + IPCA) − 1</span>
<span style="font-size: 14px; color: #c2c2c2">{{fisherExample}}</span>
</div>
<p class="pm-cap">Para comparar uma série diária (Selic) com uma mensal (IPCA), o painel usa a Selic do último dia de cada mês. O juro real "hoje" (ex-post) usa o IPCA dos últimos 12 meses; o ex-ante usa o IPCA esperado pelo Focus para os próximos 12 meses. O juro real esperado usa as medianas do Focus para o mesmo ano.</p>
<div class="pm-glass-dark" style="border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #c2c2c2">Juro neutro de referência: {{neutroValor}}</span>
<span style="font-size: 14px; color: #ededed">{{neutroFonte}} <a href="{{neutroUrl}}" target="_blank" rel="noopener">Abrir o relatório</a></span>
</div>
<p class="pm-cap">Volatilidade: {{volMetodo}}</p>
</article>

<article class="pm-glass pm-rise pm-card" aria-labelledby="t-diff" style="flex: 2 1 320px; gap: 4px; animation-delay: 200ms">
<h2 id="t-diff" class="pm-h2" style="margin: 0 0 8px">O que este painel faz diferente</h2>
<template data-for="diffs" data-as="df">
<div class="pm-row" style="display: flex; justify-content: space-between; gap: 16px; padding: 10px 4px; border-radius: 12px">
<span style="font-size: 15px; color: #ededed">{{df.text}}</span>
<span style="font-size: 15px; color: #c2c2c2; font-variant-numeric: tabular-nums">{{df.n}}</span>
</div>
</template>
</article>
</div>

<div class="pm-linha">
<article class="pm-glass pm-rise pm-card" aria-labelledby="t-glo" style="flex: 3 1 520px; gap: 10px; animation-delay: 260ms">
<h2 id="t-glo" class="pm-h2">Glossário</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px">
<template data-for="glossarioLista" data-as="g">
<div class="pm-glass-dark" style="border-radius: 16px; padding: 12px 14px"><div style="font-size: 14px; font-weight: 500">{{g.titulo}}</div><div style="font-size: 13px; color: #c2c2c2">{{g.texto}}</div><div class="pm-fonte" style="margin-top: 6px">Fonte: <template data-for="g.fontes" data-as="f"><a href="{{f.url}}" target="{{f.alvo}}" rel="noopener">{{f.t}}</a><template data-if="f.sep"> · </template></template></div></div>
</template>
</div>
</article>

<article class="pm-glass pm-rise pm-card" aria-labelledby="t-sobre" style="flex: 2 1 320px; gap: 12px; animation-delay: 300ms">
<h2 id="t-sobre" class="pm-h2">Sobre o painel</h2>
<p style="margin: 0; font-size: 14px; color: #ededed">{{sobreTxt}}</p>
<div class="pm-glass-dark" style="border-radius: 16px; padding: 12px 14px; font-size: 13px; color: #c2c2c2"><div style="color: #ededed; font-weight: 500; margin-bottom: 4px">Como citar</div>{{citacao}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a class="pm-pill" href="{{feedUrl}}">Assinar o feed (RSS)</a>
</div>
<span style="font-size: 13px; color: #c2c2c2; letter-spacing: .02em; margin-top: 4px">Baixar os dados (CSV, abre no Excel)</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="downloads" data-as="dl"><button type="button" class="pm-pill" onClick="{{dl.go}}" style="padding: 6px 12px; font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"></path></svg>{{dl.label}}</button></template>
</div>
</article>
</div>
<article class="pm-glass pm-rise pm-card" aria-labelledby="t-refs" style="gap: 10px; animation-delay: 340ms">
<h2 id="t-refs" class="pm-h2">Todas as fontes e referências</h2>
<p class="pm-cap">Dados oficiais (BCB, IBGE, B3, Tesouro Nacional, FRED), leis e documentos usados nas contas e nos textos do painel.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 6px 16px">
<template data-for="referencias" data-as="r"><a class="pm-row" href="{{r.url}}" target="_blank" rel="noopener" style="font-size: 13px; padding: 6px 4px; border-radius: 10px">{{r.t}}</a></template>
</div>
</article>

</section>
</template>

<footer class="pm-fade" style="font-size: 12px; color: rgba(237,237,237,.72); padding: 4px 4px 0; animation-delay: 1s">{{footer}}</footer>
</main>
</div>
</template>
</div>
</template>

<script src="js/motor.js"></script>
<script src="js/util.js"></script>
<script src="js/secoes/visao.js"></script>
<script src="js/secoes/expectativas.js"></script>
<script src="js/secoes/economia.js"></script>
<script src="js/secoes/agenda.js"></script>
<script src="js/secoes/metodo.js"></script>
<script src="js/movimento.js"></script>
<script src="js/painel.js"></script>
</body>
</html>
